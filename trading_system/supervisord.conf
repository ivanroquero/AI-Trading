[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONPATH="/app"

[program:mt5-rpyc-server]
command=wine /root/.wine/drive_c/Python/Python311/python.exe -u /app/rpyc_mt5_server.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startretries=15
startsecs=30
stopsignal=TERM

[program:ai-trading-bot]
command=/usr/bin/python3 /app/main.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startsecs=45   ; wait for RPyC server